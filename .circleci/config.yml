version: 2.1
jobs:
    build:
        machine:
            image: ubuntu-2204:current
        working_directory: ~/build
        steps:
            - checkout
            - run: 'sudo apt update'
            - run: 'wget https://github.com/gohugoio/hugo/releases/download/v0.168.0/hugo_extended_withdeploy_0.168.0_linux-amd64.deb'
            - run: 'sudo apt -y install ./hugo_extended_withdeploy_0.168.0_linux-amd64.deb'
            - run: 'sudo apt -y install golang-go'
            - run:
                name: Install Node.js and pnpm
                command: |
                    curl --fail --location --output /tmp/node.tar.xz https://nodejs.org/dist/v24.19.0/node-v24.19.0-linux-x64.tar.xz
                    echo '14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647  /tmp/node.tar.xz' | sha256sum --check
                    mkdir -p "$HOME/.local/node"
                    tar -xJf /tmp/node.tar.xz --strip-components=1 -C "$HOME/.local/node"
                    export PATH="$HOME/.local/node/bin:$PATH"
                    echo 'export PATH="$HOME/.local/node/bin:$PATH"' >> "$BASH_ENV"
                    npm install --global "$(node -p 'require("./package.json").packageManager')"
            - run: 'pnpm install --frozen-lockfile --ignore-scripts'
            - run: 'pnpm run build'
            - persist_to_workspace:
                root: .
                paths:
                    - public
    deploy:
        machine:
            image: ubuntu-2204:current
        working_directory: ~/build
        steps:
            - checkout
            - attach_workspace:
                at: ~/build
            - run: 'git config --global user.email $GH_EMAIL'
            - run: 'git config --global user.name $GH_NAME'
            - run: 'git clone https://github.com/tfjmp/tfjmp.github.io'
            - run: 'ls'
            - run: "rsync -av --delete --exclude='.git/' public/ tfjmp.github.io/"
            - run:
                name: 'Publish on Github.'
                command: |
                    cd tfjmp.github.io
                    git add .
                    git status
                    if ! git diff-index --exit-code --quiet HEAD; then
                        echo 'Committing...'
                        git commit -a -m "Automatically generated website, based on commit ${CIRCLE_SHA1} from https://github.com/tfjmp/website"
                        git push -q https://${GH_TOKEN}@github.com/tfjmp/tfjmp.github.io.git master
                    else
                        echo 'Nothing to commit.'
                    fi
workflows:
  version: 2
  build-and-deploy:
    jobs:
      - build
      - deploy:
          filters:
              branches:
                  only:
                      - master
          requires:
            - build
