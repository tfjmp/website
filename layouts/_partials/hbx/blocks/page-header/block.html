<div class="site-section page-header mx-auto px-6" data-pagefind-body>
  <h1 id="{{ $.wcIdentifier }}-heading" class="sr-only">{{ .wcBlock.content.title }}</h1>
  {{ with .wcBlock.content.links }}
  <nav class="page-links" aria-label="On this page">
    {{ range . }}
      <a href="{{ .url | safeURL }}">{{ .name }}</a>
    {{ end }}
  </nav>
  {{ end }}
</div>
